[package]
name = "octoscript-oh-webview"
version = "0.1.0"
edition = "2021"
description = "A Tauri-style JS to Rust bridge for OpenHarmony web surfaces, over native ArkUI"

# Named `octoscript_oh` deliberately: the artifact stays liboctoscript_oh.so, which is
# what ArkTS imports. The package name records the split; the .so name is an
# interface and does not need to churn for it.
[lib]
name = "octoscript_oh"
crate-type = ["cdylib"]

[dependencies]
octoscript-oh-arkui = { path = "../octoscript-oh-arkui" }
# The sample apps. Each is its own crate under examples/ and depends on the
# renderer; the cdylib is what links them into the module the device loads.
wechat = { path = "../../examples/wechat" }
taobao = { path = "../../examples/taobao" }
tiktok = { path = "../../examples/tiktok" }
wonderous = { path = "../../examples/wonderous" }
wonderous-makepad = { path = "../../examples/wonderous-makepad" }
material-catalog = { path = "../../examples/material-catalog" }
flutter-catalog = { path = "../../examples/flutter-catalog" }
octoscript-oh-core = { path = "../octoscript-oh-core" }
# The cdylib is what links a plugin in. A plugin crate cannot register itself
# into a library it is not part of, which is why this dependency lives here and
# not in octoscript-oh-core -- see the module docs there.
octoscript-oh-plugin-demo = { path = "../octoscript-oh-plugin-demo" }
# The Octoscript VM, via ymote/Octoscript rather than straight from makepad.
octoscript-core = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "5430518683462eebb65b56b9b5d0e620006f04f4" }
napi-derive-ohos = "0.0.9"
napi-ohos = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
