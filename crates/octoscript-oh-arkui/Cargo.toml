[package]
name = "octoscript-oh-arkui"
version = "0.1.0"
edition = "2021"
description = "Octoscript DSL rendered to OpenHarmony native ArkUI widgets, with no ArkTS in the loop"

# An rlib, not a cdylib. This crate has no napi surface of its own: the ArkTS
# side loads exactly one .so, and that is the webview crate, which depends on
# this one. Splitting the artifact would mean two copies of the ArkUI shim in
# one process.
[lib]
crate-type = ["rlib"]

[dependencies]
# The Octoscript VM, via ymote/Octoscript rather than straight from makepad.
octoscript-core = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "c014a63e09bc630da19a49600af376b5276de230" }
serde_json = "1.0.151"

[build-dependencies]
cc = "1.0"
