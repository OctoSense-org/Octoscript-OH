[package]
name = "octoscript-oh-cli"
version = "0.1.0"
edition = "2021"
description = "Host-side tooling for a Octoscript-OH app"

[[bin]]
name = "octoscript-oh"
path = "src/main.rs"

[dependencies]
octoscript-oh-core = { path = "../../crates/octoscript-oh-core" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
